services:

  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 500M
        reservations:
          memory: 200M

  db:
    image: postgres:17
    command: ["postgres", "-c", "listen_addresses=*"]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 100M
  
  adminer:
    image: adminer:5.0.2
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 50M
        reservations:
          memory: 20M
          
  grafana:
    image: grafana/grafana:12.2.0-16636675413-ubuntu
    container_name: grafana
    restart: always
    ports:
     - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana

volumes:
  postgres_data:
  grafana-storage: {}