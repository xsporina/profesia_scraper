name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  
jobs:

  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        path: ${{ secrets.WORK_DIR }}

    - name: Stop existing containers
      run: |
        cd ${{ secrets.WORK_DIR }}
        docker-compose down || echo "No containers to stop"

    - name: Remove old images
      run: |
        cd ${{ secrets.WORK_DIR }}
        docker-compose down --rmi all || echo "No containers to remove"
        
    - name: Build and start containers
      run: |
        cd ${{ secrets.WORK_DIR }}
        docker-compose up -d --build --wait

    - name: Verify deployment
      run: |
        cd ${{ secrets.WORK_DIR }}
        docker-compose ps
        echo "Deployment completed"
      
